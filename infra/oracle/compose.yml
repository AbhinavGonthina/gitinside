# The production stack on the Oracle VM: the analysis worker, its Redis, the egress
# gateway the worker's traffic leaves through, and Caddy in front of the enqueue API
# (docs/SECURITY.md §3, ADR-0074, ADR-0075). infra/oracle/provision.sh installs a systemd
# unit that runs, from the checkout and as root (the env file is root-only):
#
#   docker compose -f infra/oracle/compose.yml up -d --build --wait
#
# Secrets come from /etc/gitinside/worker.env (names in apps/worker/.env.example) and the
# Redis password from /etc/gitinside/redis.env (generated by provision.sh); the gateway
# reads only /etc/gitinside/egress.hosts, host names derived from worker.env by
# egress-hosts.sh (ADR-0083). WORKER_ENV_FILE, REDIS_ENV_FILE, and EGRESS_HOSTS_FILE point
# elsewhere (CI's container check does). Only Caddy's 443 is published to the world; the
# API is also on 127.0.0.1:8080 for the VM itself.

name: gitinside

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  # The network namespace the worker runs in: dnsmasq answers only allowlisted names, and
  # iptables lets TCP out only to the addresses it handed out (infra/oracle/egress/).
  egress:
    build:
      context: egress
    image: gitinside-egress:local
    restart: unless-stopped
    environment:
      EGRESS_INTERNAL_SUBNET: 172.30.250.0/24
    volumes:
      # Host names only, never the env file: the gateway is root with NET_ADMIN, and it
      # needs no secret to do its job.
      - ${EGRESS_HOSTS_FILE:-/etc/gitinside/egress.hosts}:/etc/gitinside/egress.hosts:ro
      - ./egress/resolv.conf:/etc/resolv.conf:ro
    # The worker shares this container's network, so its API port is published here.
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /run
    # NET_ADMIN for the rules and the ipset, NET_RAW for iptables' set match (it looks the
    # set up over a raw socket), NET_BIND_SERVICE for dnsmasq's port 53.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_BIND_SERVICE, NET_RAW]
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 32
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/egress/ready && pidof dnsmasq"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 1s
      retries: 3
    logging: *logging
    networks: [internal, outside]

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: gitinside-worker:local
    restart: unless-stopped
    init: true
    # The analysis child gets none of this: it starts with an empty environment (ADR-0059),
    # so even if its network guard failed it couldn't authenticate to Redis.
    env_file:
      - ${WORKER_ENV_FILE:-/etc/gitinside/worker.env}
      - ${REDIS_ENV_FILE:-/etc/gitinside/redis.env}
    environment:
      # These belong to the stack, not the secrets file, so they always win.
      REDIS_URL: redis://redis:6379
      JOBS_ROOT: /tmp/jobs
      HOST: 0.0.0.0
      PORT: "8080"
    # Every packet in or out goes through the gateway's rules (ADR-0075).
    network_mode: service:egress
    volumes:
      - ./egress/resolv.conf:/etc/resolv.conf:ro
    # Hardening: an unprivileged user (the image's `node`), nothing writable but the
    # job folder, no capabilities, no privilege gain, Docker's default seccomp profile
    # (applied because nothing here turns it off).
    user: "1000:1000"
    read_only: true
    tmpfs:
      # Two jobs at once, each at most 500 MiB extracted plus its graph (SECURITY.md T3).
      # noexec: nothing in a job folder is ever run.
      - /tmp/jobs:size=1200m,mode=0700,uid=1000,gid=1000,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Resources on a 4 OCPU / 24 GB A1 VM: two analysis children at 3 GB heap each, the
    # worker itself, and the tmpfs (counted as memory); one core left for Redis, Caddy,
    # the gateway, and the OS.
    cpus: 3
    mem_limit: 12g
    memswap_limit: 12g
    pids_limit: 256
    # The worker stops within 20 s of SIGTERM (ADR-0065); Docker waits longer before SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 3
    logging: *logging
    depends_on:
      egress:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # BullMQ needs `noeviction`; the append-only file keeps queued jobs across restarts.
    # The password goes in as config on stdin (`redis-server -`), so it's never on a
    # command line `ps` shows; Redis refuses to start without one.
    env_file:
      - ${REDIS_ENV_FILE:-/etc/gitinside/redis.env}
    command:
      - sh
      - -c
      - >-
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is not set}";
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" |
        exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction -
    # Running as `redis` from the start means the image's entrypoint never needs to change
    # users, so no capability is required.
    user: redis
    read_only: true
    volumes:
      - redis-data:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 768m
    pids_limit: 64
    healthcheck:
      # redis-cli reads the password from REDISCLI_AUTH, not its arguments.
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    # No published port, and only the internal network: Redis is reachable from the worker
    # alone and can't reach anything itself.
    networks: [internal]

  # TLS on 443 for worker.gitinside.abhinavgonthina.dev (infra/oracle/Caddyfile).
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      WORKER_DOMAIN: ${WORKER_DOMAIN:-worker.gitinside.abhinavgonthina.dev}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account survive rebuilds of the stack.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "443:443"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    logging: *logging
    depends_on:
      egress:
        condition: service_healthy
    # Needs the internet for Let's Encrypt; reaches the API as egress:8080.
    networks: [outside]

networks:
  # No route out of the host: Redis lives here. A fixed subnet, so the gateway can allow
  # exactly this network.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.250.0/24
  # The way out, for the gateway (and so the worker, through its rules) and Caddy.
  outside: {}

volumes:
  redis-data:
  caddy-data:
  caddy-config:
