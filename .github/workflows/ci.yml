name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On main, a manual run redeploys (e.g. after a deploy that failed half way).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Real Postgres for packages/db: its tests make a fresh database per file
    # here instead of PGlite (ADR-0057). Same image as infra/docker-compose.dev.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gitinside
          POSTGRES_PASSWORD: gitinside
          POSTGRES_DB: gitinside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitinside -d gitinside"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://gitinside:gitinside@localhost:5432/gitinside
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm coverage
      # The migrate CLI from the built package, twice: the second run must be a no-op.
      - run: pnpm --filter @gitinside/db migrate
        env:
          DATABASE_URL: postgres://gitinside:gitinside@localhost:5432/gitinside
      - run: pnpm --filter @gitinside/db migrate
        env:
          DATABASE_URL: postgres://gitinside:gitinside@localhost:5432/gitinside
      - run: pnpm --filter @gitinside/viewer build-storybook

  # The production worker image (ADR-0111, ADR-0150): built, started as Cloud Run starts
  # it (plain `docker run`, PORT, 1 vCPU / 4 GiB, /tmp in memory), and checked for the
  # hardening the image itself must carry, with a sandboxed analysis run inside it.
  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker version
      - run: node infra/gcp/check.mjs

  # Every story in dark and light against packages/viewer/visual/baselines/
  # (docs/TESTING.md, ADR-0053). Re-capture with the "Visual baselines" workflow.
  visual:
    runs-on: ubuntu-latest
    container:
      # Keep in step with @playwright/test in packages/viewer/package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The viewer's workspace dependencies (schema, diff), which it imports from their dist.
      - run: pnpm --filter "@gitinside/viewer^..." build
      - run: pnpm --filter @gitinside/viewer build-storybook
      - run: pnpm --filter @gitinside/viewer visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            packages/viewer/dist/visual-report/
            packages/viewer/dist/visual-results/

  # The website's production build in Chromium: CSP with hydration, fonts,
  # tokens, the theme cookie, the repo form, and the explorer on a seeded
  # PGlite database (apps/web/e2e, ADR-0132), and its key screens in dark and
  # light against apps/web/e2e/baselines/ (ADR-0133). Re-capture with the
  # "Visual baselines" workflow.
  web-e2e:
    runs-on: ubuntu-latest
    container:
      # Keep in step with @playwright/test in apps/web/package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@gitinside/web
      - run: pnpm --filter @gitinside/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: |
            apps/web/dist/e2e-report/
            apps/web/dist/e2e-results/

  # The worker and the billing kill switch onto Cloud Run, keyless (ADR-0111, ADR-0170):
  # GitHub's OIDC token for this job becomes gitinside-deploy through Workload Identity
  # Federation (infra/gcp/github.json admits only this file on main, from a push or a manual
  # run). Only once every other job is green, only when the image's inputs changed, and idle
  # until the repo variables from planning #3 exist. Everything deployed comes from
  # infra/gcp; infra/gcp/deploy.mjs does the work.
  deploy:
    needs: [check, worker-image, visual, web-e2e]
    if: >-
      github.repository == 'AbhinavGonthina/gitinside' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.GCP_PROJECT_NUMBER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time; a newer push waits rather than cancelling one half way.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      SNAPSHOTS_NAMESPACE: ${{ vars.SNAPSHOTS_NAMESPACE }}
      SNAPSHOTS_REGION: ${{ vars.SNAPSHOTS_REGION }}
      SNAPSHOTS_BUCKET: ${{ vars.SNAPSHOTS_BUCKET }}
      SNAPSHOTS_ACCESS_KEY_ID: ${{ vars.SNAPSHOTS_ACCESS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pushed range, to tell whether the image's inputs changed.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: changed
        run: node infra/gcp/deploy.mjs changed "$BEFORE" "$GITHUB_SHA"
        env:
          # Empty on a manual run, which always deploys.
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
      - id: plan
        if: steps.changed.outputs.deploy == 'true'
        run: node infra/gcp/deploy.mjs plan
      # Pinned by commit: this step holds the job's Google credentials.
      - if: steps.changed.outputs.deploy == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ steps.plan.outputs.provider }}
          service_account: ${{ steps.plan.outputs.account }}
      - if: steps.changed.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - if: steps.changed.outputs.deploy == 'true'
        run: node infra/gcp/deploy.mjs apply "$GITHUB_SHA"
