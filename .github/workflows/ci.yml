name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm --filter @gitinside/viewer build-storybook

  # Every story in dark and light against packages/viewer/visual/baselines/
  # (docs/TESTING.md, ADR-0053). Re-capture with the "Visual baselines" workflow.
  visual:
    runs-on: ubuntu-latest
    container:
      # Keep in step with @playwright/test in packages/viewer/package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gitinside/schema build
      - run: pnpm --filter @gitinside/viewer build-storybook
      - run: pnpm --filter @gitinside/viewer visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            packages/viewer/dist/visual-report/
            packages/viewer/dist/visual-results/

  # The website's production build in Chromium: CSP with hydration, fonts,
  # tokens, the theme cookie, the repo form (apps/web/e2e).
  web-e2e:
    runs-on: ubuntu-latest
    container:
      # Keep in step with @playwright/test in apps/web/package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@gitinside/web
      - run: pnpm --filter @gitinside/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: |
            apps/web/dist/e2e-report/
            apps/web/dist/e2e-results/
