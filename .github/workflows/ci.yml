name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Real Postgres for packages/db: its tests make a fresh database per file
    # here instead of PGlite (ADR-0057). Same image as infra/docker-compose.dev.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gitinside
          POSTGRES_PASSWORD: gitinside
          POSTGRES_DB: gitinside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitinside -d gitinside"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      # Real Redis for apps/worker's BullMQ tests (ADR-0061); they skip without
      # TEST_REDIS_URL, and fail on CI if it's missing.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://gitinside:gitinside@localhost:5432/gitinside
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm coverage
      # The migrate CLI from the built package, twice: the second run must be a no-op.
      - run: pnpm --filter @gitinside/db migrate
        env:
          DATABASE_URL: postgres://gitinside:gitinside@localhost:5432/gitinside
      - run: pnpm --filter @gitinside/db migrate
        env:
          DATABASE_URL: postgres://gitinside:gitinside@localhost:5432/gitinside
      - run: pnpm --filter @gitinside/viewer build-storybook

  # The production worker image and stack (infra/oracle, ADR-0074, ADR-0075): built,
  # started, and checked for its hardening, egress allowlist, and TLS proxy, with a
  # sandboxed analysis run inside it. The VM's provisioning script is linted here; it
  # installs Docker, so it only runs on the VM.
  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: shellcheck infra/oracle/provision.sh infra/oracle/egress-hosts.sh infra/oracle/egress/entrypoint.sh
      - run: docker version
      - run: docker compose version
      # The same kernel modules provision.sh loads on the VM, for the gateway's ipset.
      - run: sudo modprobe -a ip_set ip_set_hash_ip xt_set xt_owner
      - run: node infra/oracle/check.mjs

  # Every story in dark and light against packages/viewer/visual/baselines/
  # (docs/TESTING.md, ADR-0053). Re-capture with the "Visual baselines" workflow.
  visual:
    runs-on: ubuntu-latest
    container:
      # Keep in step with @playwright/test in packages/viewer/package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The viewer's workspace dependencies (schema, diff), which it imports from their dist.
      - run: pnpm --filter "@gitinside/viewer^..." build
      - run: pnpm --filter @gitinside/viewer build-storybook
      - run: pnpm --filter @gitinside/viewer visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            packages/viewer/dist/visual-report/
            packages/viewer/dist/visual-results/

  # The website's production build in Chromium: CSP with hydration, fonts,
  # tokens, the theme cookie, the repo form (apps/web/e2e).
  web-e2e:
    runs-on: ubuntu-latest
    container:
      # Keep in step with @playwright/test in apps/web/package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@gitinside/web
      - run: pnpm --filter @gitinside/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: |
            apps/web/dist/e2e-report/
            apps/web/dist/e2e-results/
